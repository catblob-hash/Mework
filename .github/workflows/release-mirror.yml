# Copies each published release to the download mirror at https://dl.mework.dev
# (the R2 bucket `mework-releases` behind that custom domain), then rewrites
# latest.json there and rebuilds the site. scripts/release-mirror.mjs does the
# work and checks every file against GitHub's digest and SHA256SUMS.
#
# Uploading an asset to an existing release (`gh release upload --clobber`)
# fires no release event: run this workflow by hand with that tag afterwards,
# and it replaces the changed files and purges their CDN copies.
#
# Repository settings it needs:
#   secret   CLOUDFLARE_API_TOKEN   Workers R2 Storage: Edit, and Zone · Cache
#                                   Purge on mework.dev
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable CLOUDFLARE_ZONE_ID     the mework.dev zone
#
# The bucket was set up once with wrangler:
#   wrangler r2 bucket create mework-releases --location apac
#   wrangler r2 bucket domain add mework-releases --domain dl.mework.dev --zone-id <zone> --min-tls 1.2
#   wrangler r2 bucket cors set mework-releases --file <rules>   # GET and HEAD from any origin
name: Release mirror

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to mirror (empty for the latest release)
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: release-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mirror
        run: node scripts/release-mirror.mjs ${TAG:+--tag "$TAG"}
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      - name: Rebuild the site
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
