[package]
name = "mework-local-model"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false
description = "Mework's local helper model: Qwen3.5-0.8B weights, tokenizer and inference backends."
build = "build.rs"

[lib]
# The host imports this crate as `local_model`.
name = "local_model"
path = "src/lib.rs"

[features]
# The MLX backend (`local_model::mlx::MlxBackend`) for Apple silicon: fetches
# Apple's prebuilt MLX at build time and builds `mlx/mework_mlx.cpp` against it
# (see build.rs). Nothing on other targets.
mlx = []
# The llama.cpp backend (`local_model::llama`), for Windows and Linux; Apple
# platforms use Core ML and MLX. Nothing of llama.cpp is compiled here: the
# backend loads the libraries of llama.cpp's own release build
# (`llama::runtime`, downloaded with the model), whose ggml backends (every CPU
# variant, and Vulkan for any GPU vendor) are picked at run time.
llama = ["dep:libloading", "dep:flate2", "dep:tar", "dep:windows-sys"]

[dependencies]
memmap2 = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
# The llama.cpp release build: loaded at run time (libloading) and unpacked
# from its official archive, a zip on Windows (flate2) and a .tar.gz on Linux.
libloading = { version = "0.8", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
# The version of the C++ runtime (msvcp140.dll) the llama.cpp release build
# binds to, checked before loading it.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Core ML is the only public route onto the Apple Neural Engine. Same objc2
# generation as the host's AppKit bindings.
block2 = "0.6"
libc = "0.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue", "NSFileManager"] }
objc2-core-ml = { version = "0.3.2", default-features = false, features = ["std", "block2", "MLModel", "MLModelConfiguration", "MLModel_MLModelCompilation", "MLModel_MLState", "MLState", "MLMultiArray", "MLFeatureValue", "MLFeatureProvider", "MLDictionaryFeatureProvider", "MLPredictionOptions", "MLOptimizationHints", "MLSpecializationStrategy", "MLComputeDeviceProtocol", "MLNeuralEngineComputeDevice"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "build_release"
required-features = ["mlx"]
